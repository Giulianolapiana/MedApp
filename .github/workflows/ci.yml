name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install Dependencies
        run: |
          cd backend && pnpm install

      - name: Run Linter (Oxlint)
        run: npx oxlint@latest -c .oxlintrc.json

      - name: Run Backend Unit Tests
        run: cd backend && pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Build Backend
        run: |
          cd backend
          pnpm install
          pnpm build

      - name: Build Frontend Admin
        run: |
          cd ParteAdmin/Frontend
          pnpm install
          pnpm build

      - name: Build Frontend Paciente
        run: |
          cd PartePaciente/paciente-app
          pnpm install
          pnpm build
