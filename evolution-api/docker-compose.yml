version: '3.3'

services:
  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      # Configuraciones básicas
      - SERVER_URL=http://localhost:8080
      - DOCKER_ENV=true
      - LOG_LEVEL=ERROR
      
      # Base de Datos PostgreSQL
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://postgres:medapp123@evolution-postgres:5432/evolution?schema=public
      
      # Seguridad y API
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=B6D711FCDE4F4FD59865FDDFA4674116
      
      # Datos que va a ver el celular al escanear
      - CONFIG_SESSION_PHONE_CLIENT=MedAPP
      - CONFIG_SESSION_PHONE_NAME=Edge
    depends_on:
      - evolution-postgres
    volumes:
      - ./instances:/evolution/instances

  evolution-postgres:
    image: postgres:15-alpine
    container_name: evolution-postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=medapp123
      - POSTGRES_DB=evolution
    volumes:
      - evolution_db_data:/var/lib/postgresql/data

volumes:
  evolution_db_data:
